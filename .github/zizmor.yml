rules:
  dangerous-triggers:
    ignore:
      # Calls the org-wide Dependabot workflow in fallow-rs/.github, pinned by
      # SHA. That workflow acts only on same-repository dependabot/** branches
      # and loads its scripts from its own commit.
      - dependabot.yml
  # ci-ok job uses toJSON(needs.*.result), which only contains
  # success/failure/cancelled/skipped tokens; no untrusted user input.
  template-injection:
    ignore:
      - ci.yml
